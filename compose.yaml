services:
  db:
    image: pgvector/pgvector:0.8.5-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interview}
      POSTGRES_USER: ${POSTGRES_USER:-interview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interview-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-interview}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-interview}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-interview-local-only}
      APP_ANSWER_EVALUATION_PROFILE: ${APP_ANSWER_EVALUATION_PROFILE:-ai}
      APP_QUESTION_ENRICHMENT_PROFILE: ${APP_QUESTION_ENRICHMENT_PROFILE:-ai}
      APP_EMBEDDING_PROFILE: ${APP_EMBEDDING_PROFILE:-local}
      APP_QUESTION_BANK_SEED_ENABLED: ${APP_QUESTION_BANK_SEED_ENABLED:-false}
      APP_KAFKA_INDEXING_ENABLED: ${APP_KAFKA_INDEXING_ENABLED:-false}
      APP_KAFKA_INDEXING_TOPIC: ${APP_KAFKA_INDEXING_TOPIC:-question-indexing.v1}
      APP_KAFKA_INDEXING_DLT_TOPIC: ${APP_KAFKA_INDEXING_DLT_TOPIC:-question-indexing.v1.DLT}
      APP_KAFKA_INDEXING_GROUP_ID: ${APP_KAFKA_INDEXING_GROUP_ID:-automated-interview-question-indexer}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-}
      AIVEN_KAFKA_USERNAME: ${AIVEN_KAFKA_USERNAME:-}
      AIVEN_KAFKA_PASSWORD: ${AIVEN_KAFKA_PASSWORD:-}
      AIVEN_KAFKA_CA_CERTIFICATE: ${AIVEN_KAFKA_CA_CERTIFICATE:-}
      APP_QUESTION_BANK_MAX_IMPORT_QUESTIONS: ${APP_QUESTION_BANK_MAX_IMPORT_QUESTIONS:-50}
      APP_QUESTION_BANK_MAX_TOTAL_QUESTIONS: ${APP_QUESTION_BANK_MAX_TOTAL_QUESTIONS:-10000}
      APP_QUESTION_BANK_PAGE_SIZE: ${APP_QUESTION_BANK_PAGE_SIZE:-50}
      APP_QUESTION_BANK_MAX_PAGE_SIZE: ${APP_QUESTION_BANK_MAX_PAGE_SIZE:-100}
      APP_INTERVIEW_QUESTIONS_PER_SESSION: ${APP_INTERVIEW_QUESTIONS_PER_SESSION:-3}
      APP_INTERVIEW_MAX_QUESTIONS_PER_SESSION: ${APP_INTERVIEW_MAX_QUESTIONS_PER_SESSION:-10}
      QUESTION_BANK_API_KEY: ${QUESTION_BANK_API_KEY:-}
      APP_SPRING_AI_ENABLED: ${APP_SPRING_AI_ENABLED:-true}
      SPRING_AI_MODEL_CHAT: ${SPRING_AI_MODEL_CHAT:-google-genai}
      SPRING_AI_MODEL_EMBEDDING_TEXT: ${SPRING_AI_MODEL_EMBEDDING_TEXT:-google-genai}
      APP_SPRING_AI_CREDENTIALS_AVAILABLE: ${APP_SPRING_AI_CREDENTIALS_AVAILABLE:-true}
      VERTEX_PROJECT_ID: intervu-ai-20260704-8f3c
      SPRING_AI_GOOGLE_GENAI_PROJECT_ID: intervu-ai-20260704-8f3c
      SPRING_AI_GOOGLE_GENAI_LOCATION: ${VERTEX_LOCATION:-us-central1}
      SPRING_AI_GOOGLE_GENAI_EMBEDDING_PROJECT_ID: intervu-ai-20260704-8f3c
      SPRING_AI_GOOGLE_GENAI_EMBEDDING_LOCATION: ${VERTEX_LOCATION:-us-central1}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
      VERTEX_CHAT_MODEL: ${VERTEX_CHAT_MODEL:-gemini-2.5-flash-lite}
      VERTEX_EMBEDDING_MODEL: ${VERTEX_EMBEDDING_MODEL:-text-embedding-005}
      VERTEX_EMBEDDING_DIMENSIONS: ${VERTEX_EMBEDDING_DIMENSIONS:-768}
      AI_DATA_RETENTION_ACKNOWLEDGED: ${AI_DATA_RETENTION_ACKNOWLEDGED:-false}
    volumes:
      - ${APPDATA}/gcloud:/root/.config/gcloud:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:80"
    depends_on:
      - backend

volumes:
  postgres-data:
