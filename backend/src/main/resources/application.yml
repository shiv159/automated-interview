app:
  kafka:
    indexing:
      enabled: ${APP_KAFKA_INDEXING_ENABLED:false}
      topic: ${APP_KAFKA_INDEXING_TOPIC:question-indexing.v1}
      dlt-topic: ${APP_KAFKA_INDEXING_DLT_TOPIC:question-indexing.v1.DLT}
      group-id: ${APP_KAFKA_INDEXING_GROUP_ID:automated-interview-question-indexer}
      recovery-ms: ${APP_KAFKA_INDEXING_RECOVERY_MS:60000}
  question-bank:
    seed-enabled: ${APP_QUESTION_BANK_SEED_ENABLED:false}
    api-key: ${QUESTION_BANK_API_KEY:}
    max-import-questions: ${APP_QUESTION_BANK_MAX_IMPORT_QUESTIONS:50}
    max-total-questions: ${APP_QUESTION_BANK_MAX_TOTAL_QUESTIONS:10000}
    page-size: ${APP_QUESTION_BANK_PAGE_SIZE:50}
    max-page-size: ${APP_QUESTION_BANK_MAX_PAGE_SIZE:100}
  interview:
    questions-per-session: ${APP_INTERVIEW_QUESTIONS_PER_SESSION:3}
    max-questions-per-session: ${APP_INTERVIEW_MAX_QUESTIONS_PER_SESSION:10}
  embedding:
    profile: ${APP_EMBEDDING_PROFILE:local}
  ai:
    enabled: ${APP_SPRING_AI_ENABLED:true}
    max-attempts: ${APP_AI_MAX_ATTEMPTS:2}
    retry-backoff-ms: ${APP_AI_RETRY_BACKOFF_MS:100}
    embedding-dimensions: ${VERTEX_EMBEDDING_DIMENSIONS:768}
    embedding-batch-size: ${APP_AI_EMBEDDING_BATCH_SIZE:32}
server:
  port: 8080
spring:
  application:
    name: automated-interview
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:}
    properties:
      security.protocol: ${SPRING_KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${SPRING_KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username='${AIVEN_KAFKA_USERNAME:}' password='${AIVEN_KAFKA_PASSWORD:}';
      ssl.truststore.type: ${SPRING_KAFKA_SSL_TRUSTSTORE_TYPE:PEM}
      ssl.truststore.certificates: ${AIVEN_KAFKA_CA_CERTIFICATE:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${APP_KAFKA_INDEXING_GROUP_ID:automated-interview-question-indexer}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/interview}
    username: ${SPRING_DATASOURCE_USERNAME:interview}
    password: ${SPRING_DATASOURCE_PASSWORD:interview-local-only}
    hikari:
      connection-timeout: ${SPRING_DATASOURCE_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${SPRING_DATASOURCE_VALIDATION_TIMEOUT_MS:5000}
      max-lifetime: ${SPRING_DATASOURCE_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${SPRING_DATASOURCE_KEEPALIVE_TIME_MS:30000}
      minimum-idle: ${SPRING_DATASOURCE_MINIMUM_IDLE:1}
      maximum-pool-size: ${SPRING_DATASOURCE_MAXIMUM_POOL_SIZE:5}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 5MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    vectorstore:
      pgvector:
        initialize-schema: false
    model:
      chat: ${SPRING_AI_MODEL_CHAT:google-genai}
      embedding:
        text: ${SPRING_AI_MODEL_EMBEDDING_TEXT:google-genai}
    google:
      genai:
        project-id: ${VERTEX_PROJECT_ID:}
        location: ${VERTEX_LOCATION:us-central1}
        embedding:
          project-id: ${VERTEX_PROJECT_ID:}
          location: ${VERTEX_LOCATION:us-central1}
          text:
            model: ${VERTEX_EMBEDDING_MODEL:text-embedding-005}
            dimensions: ${VERTEX_EMBEDDING_DIMENSIONS:768}
            task-type: RETRIEVAL_DOCUMENT
        chat:
          model: ${VERTEX_CHAT_MODEL:gemini-2.5-flash-lite}
          temperature: 0.0
          response-mime-type: application/json
    chat:
      client:
        enabled: ${SPRING_AI_CHAT_CLIENT_ENABLED:true}
      observations:
        include-error-logging: true
        log-prompt: false
        log-completion: false
logging:
  pattern:
    level: "%5p [corr=%X{correlationId:-none}]"
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  metrics:
    tags:
      application: ${spring.application.name}
