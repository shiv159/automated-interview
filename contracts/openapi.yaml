openapi: 3.0.3
info:
  title: Automated Interview Platform API
  version: 1.0.0
paths:
  /api/health:
    get:
      responses:
        '200': {description: Healthy}
  /api/v1/sessions:
    post:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [jobDescription, resume, yearsExperience, syntheticDataAttested]
              properties:
                jobDescription: {type: string, format: binary}
                resume: {type: string, format: binary}
                yearsExperience: {type: integer, minimum: 0, maximum: 30}
                syntheticDataAttested: {type: boolean}
                roleTitle: {type: string, maxLength: 160, description: Optional role title shown during interview practice}
      responses:
        '201':
          description: Created
          content: {application/json: {schema: {$ref: '#/components/schemas/SessionResponse'}}}
        '400': {description: Invalid input}
        '503': {description: Provider unavailable}
  /api/v1/question-bank:
    get:
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: search, in: query, schema: {type: string}}
        - {name: skill, in: query, schema: {type: string}}
        - {name: difficulty, in: query, schema: {type: string, enum: [EASY, MEDIUM, HARD]}}
        - {name: origin, in: query, schema: {type: string, enum: [SEED, OWNER_IMPORT]}}
      responses:
        '200':
          description: Public question metadata, including rubric and ideal answer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuestionBankResponse'}
  /api/v1/question-bank/import:
    post:
      description: Import up to 50 UTF-8 questions from a .txt file (one stem per line) or a .json file containing an array of structured question objects. AI enrichment supplies tags and ideal answers; duplicate stems update the existing owner-import question.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [questionsFile]
              properties:
                questionsFile:
                  type: string
                  format: binary
                  description: UTF-8 .txt or .json file; JSON objects use the QuestionImportItem schema.
      responses:
        '200':
          description: Updated existing questions
          content: {application/json: {schema: {$ref: '#/components/schemas/QuestionImportResponse'}}}
        '201':
          description: Created new questions
          content: {application/json: {schema: {$ref: '#/components/schemas/QuestionImportResponse'}}}
        '400': {description: Invalid file or item data, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {description: Rejected with structured item diagnostics, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /api/v1/question-bank/analyze:
    post:
      description: Analyze up to 50 uploaded questions, classify them, and return individually reviewable new skill suggestions.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [questionsFile]
              properties:
                questionsFile: {type: string, format: binary}
      responses:
        '200': {description: Question analysis draft, content: {application/json: {schema: {$ref: '#/components/schemas/QuestionAnalysisResponse'}}}}
  /api/v1/question-bank/import-draft:
    post:
      description: Import reviewed valid question rows and individually approved skills; invalid rows are skipped.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DraftImportRequest'}}}
      responses:
        '200': {description: Import completed, content: {application/json: {schema: {$ref: '#/components/schemas/QuestionImportResponse'}}}}
  /api/v1/sessions/{sessionId}/interview:
    post:
      parameters: [{name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200':
          description: Current question and interview progress
          content: {application/json: {schema: {$ref: '#/components/schemas/QuestionResponse'}}}
  /api/v1/sessions/{sessionId}:
    get:
      parameters: [{name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200':
          description: Session analysis snapshot
          content: {application/json: {schema: {$ref: '#/components/schemas/SessionResponse'}}}
        '401': {description: Not owner}
        '410': {description: Expired}
    delete:
      parameters: [{name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Deleted}, '401': {description: Not owner}}
  /api/v1/sessions/{sessionId}/questions/{instanceId}/answers:
    post:
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: instanceId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AnswerRequest'}}}
      responses:
        '200':
          description: Evaluation and next question
          content: {application/json: {schema: {$ref: '#/components/schemas/AnswerResponse'}}}
  /api/v1/sessions/{sessionId}/report:
    get:
      parameters: [{name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200':
          description: Completed report; aggregate scores are 0-100 and individual answer scores are 0-10
          content: {application/json: {schema: {$ref: '#/components/schemas/ReportResponse'}}}
  /api/v1/documents/preview:
    post:
      description: Extract a bounded text preview from a PDF or DOCX without creating a session.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: {file: {type: string, format: binary}}
      responses:
        '200':
          description: Extracted document preview
          content: {application/json: {schema: {$ref: '#/components/schemas/DocumentPreviewResponse'}}}
        '400': {description: Invalid or unsupported document}
        '413': {description: Document exceeds the configured size or page limit}
  /api/v1/question-bank/questions/{id}/status:
    patch:
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [status], additionalProperties: false, properties: {status: {type: string, enum: [ACTIVE, INACTIVE]}}}}}
      responses: {'204': {description: Updated}, '409': {description: Seed immutable}}
components:
  schemas:
    AnswerRequest:
      type: object
      required: [answer]
      additionalProperties: false
      properties: {answer: {type: string, maxLength: 4000}}
    SessionResponse:
      type: object
      required: [id, expiresAt, roleTitle, difficulty, profileMatch, jobSkills, resumeSkills, matchedSkills, missingSkills, unsupportedJobSkills]
      properties:
        id: {type: string, format: uuid}
        expiresAt: {type: string, format: date-time}
        roleTitle: {type: string}
        difficulty: {type: string}
        profileMatch: {type: number, description: Aggregate profile match score from 0 to 100}
        jobSkills: {type: array, items: {$ref: '#/components/schemas/SkillClaim'}}
        resumeSkills: {type: array, items: {$ref: '#/components/schemas/SkillClaim'}}
        matchedSkills: {type: array, items: {type: string}}
        missingSkills: {type: array, items: {type: string}}
        unsupportedJobSkills: {type: array, items: {type: string}}
    AnswerResponse:
      type: object
      required: [position, score, strengths, improvements, nextQuestion]
      properties:
        position: {type: integer}
        score: {type: number, description: Individual answer score from 0 to 10}
        strengths: {type: array, items: {type: string}}
        improvements: {type: array, items: {type: string}}
        nextQuestion: {oneOf: [{$ref: '#/components/schemas/QuestionResponse'}, {type: 'null'}]}
    QuestionImportResponse:
      type: object
      required: [createdCount, updatedCount, skippedCount, questions, errors]
      properties:
        createdCount: {type: integer}
        updatedCount: {type: integer}
        skippedCount: {type: integer}
        questions: {type: array, items: {$ref: '#/components/schemas/QuestionSummary'}}
        errors: {type: array, items: {$ref: '#/components/schemas/ImportDiagnostic'}}
    Problem:
      type: object
      required: [type, title, status, detail, instance, code, correlationId]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string}
        correlationId: {type: string}
        item: {type: integer, minimum: 1, nullable: true}
        line: {type: integer, minimum: 1, nullable: true}
        field: {type: string, nullable: true}
        hint: {type: string, nullable: true}
        errors:
          type: array
          items: {$ref: '#/components/schemas/ImportDiagnostic'}
    ImportDiagnostic:
      type: object
      required: [code, status, message]
      properties:
        code: {type: string}
        status: {type: integer}
        item: {type: integer, minimum: 1, nullable: true}
        line: {type: integer, minimum: 1, nullable: true}
        field: {type: string, nullable: true}
        message: {type: string}
        hint: {type: string, nullable: true}
    QuestionImportItem:
      type: object
      required: [stem]
      additionalProperties: false
      properties:
        stem: {type: string, minLength: 10, maxLength: 1000}
        type: {type: string, enum: [TECHNICAL, BEHAVIORAL]}
        primarySkill: {type: string, description: Canonical skill ID required when technical classification is ambiguous}
        secondarySkills: {type: array, uniqueItems: true, items: {type: string}}
        difficulty: {type: string, enum: [EASY, MEDIUM, HARD]}
    DocumentPreviewResponse:
      type: object
      required: [text, truncated, documentType]
      properties:
        text: {type: string}
        truncated: {type: boolean}
        documentType: {type: string, enum: [PDF, DOCX, TXT]}
    SkillClaim:
      type: object
      required: [skillId, importance, evidence, matched]
      properties:
        skillId: {type: string}
        importance: {type: string}
        evidence: {type: string}
        matched: {type: boolean}
    QuestionSummary:
      type: object
      required: [id, stem, origin, status, type, tags, rubric, updatedAt]
      properties:
        id: {type: string, format: uuid}
        stem: {type: string}
        origin: {type: string}
        status: {type: string}
        type: {type: string, enum: [TECHNICAL, BEHAVIORAL]}
        primarySkill: {type: [string, 'null']}
        secondarySkills: {type: string}
        difficulty: {type: [string, 'null']}
        tags: {type: string}
        rubric: {type: string}
        idealAnswer: {type: [string, 'null']}
        updatedAt: {type: string, format: date-time}
    QuestionAnalysisResponse:
      type: object
      required: [questions, newSkills]
      properties:
        questions: {type: array, items: {$ref: '#/components/schemas/AnalysisQuestion'}}
        newSkills: {type: array, items: {$ref: '#/components/schemas/SkillSuggestion'}}
        errors: {type: array, items: {$ref: '#/components/schemas/ImportDiagnostic'}}
    AnalysisQuestion:
      type: object
      required: [stem, status]
      properties:
        stem: {type: string}
        type: {type: [string, 'null']}
        primarySkill: {type: [string, 'null']}
        secondarySkills: {type: array, items: {type: string}}
        difficulty: {type: [string, 'null']}
        tags: {type: array, items: {type: string}}
        idealAnswer: {type: [string, 'null']}
        status: {type: string}
        errorCode: {type: [string, 'null']}
    SkillSuggestion:
      type: object
      required: [id, displayName, aliases, questionIndexes]
      properties:
        id: {type: string}
        displayName: {type: string}
        aliases: {type: array, items: {type: string}}
        questionIndexes: {type: array, items: {type: integer}}
    DraftImportRequest:
      type: object
      required: [questions, approvedSkills]
      properties:
        questions: {type: array, items: {$ref: '#/components/schemas/DraftQuestion'}}
        approvedSkills: {type: array, items: {$ref: '#/components/schemas/ApprovedSkill'}}
    DraftQuestion:
      allOf:
        - {$ref: '#/components/schemas/AnalysisQuestion'}
    ApprovedSkill:
      type: object
      required: [id, displayName, aliases]
      properties:
        id: {type: string}
        displayName: {type: string}
        aliases: {type: array, items: {type: string}}
        version: {type: string}
    QuestionBankResponse:
      type: object
      required: [questions, total, activeCount, skillAreaCount, coverage, skills, page, size, totalPages]
      properties:
        questions: {type: array, items: {$ref: '#/components/schemas/QuestionSummary'}}
        total: {type: integer}
        activeCount: {type: integer}
        skillAreaCount: {type: integer}
        coverage: {type: array, items: {type: object}}
        skills: {type: array, items: {$ref: '#/components/schemas/SkillOption'}}
        page: {type: integer}
        size: {type: integer}
        totalPages: {type: integer}
    SkillOption:
      type: object
      required: [id, displayName, aliases]
      properties:
        id: {type: string}
        displayName: {type: string}
        aliases: {type: array, items: {type: string}}
    QuestionResponse:
      type: object
      required: [instanceId, position, totalQuestions, roleTitle, type, stem, guidance]
      properties:
        instanceId: {type: string, format: uuid}
        position: {type: integer}
        totalQuestions: {type: integer}
        roleTitle: {type: string}
        type: {type: string}
        primarySkill: {type: [string, 'null']}
        difficulty: {type: [string, 'null']}
        stem: {type: string}
        criteria: {type: string}
        guidance: {type: string}
    ReportResponse:
      type: object
      required: [sessionId, roleTitle, evaluations, profileMatch, technicalScore, behavioralScore, interviewScore, readinessScore, readinessLabel, expiresAt]
      properties:
        sessionId: {type: string, format: uuid}
        roleTitle: {type: string}
        evaluations: {type: array, items: {$ref: '#/components/schemas/EvaluationSummary'}}
        profileMatch: {type: number, description: Aggregate score from 0 to 100}
        technicalScore: {type: number, description: Aggregate score from 0 to 100}
        behavioralScore: {type: number, description: Aggregate score from 0 to 100}
        interviewScore: {type: number, description: Aggregate score from 0 to 100}
        readinessScore: {type: number, description: Aggregate score from 0 to 100}
        readinessLabel: {type: string}
        expiresAt: {type: string, format: date-time}
    EvaluationSummary:
      type: object
      required: [position, type, stem, criteria, criteriaScores, score, strengths, improvements]
      properties:
        position: {type: integer}
        type: {type: string}
        primarySkill: {type: [string, 'null']}
        stem: {type: string}
        criteria: {type: string}
        criteriaScores: {type: array, items: {type: object, required: [criterion, score], properties: {criterion: {type: string}, score: {type: number, minimum: 0, maximum: 10}, feedback: {type: string}}}}
        score: {type: number, minimum: 0, maximum: 10}
        strengths: {type: string}
        improvements: {type: string}
