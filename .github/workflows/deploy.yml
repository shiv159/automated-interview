name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
  AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
  BACKEND_SERVICE_NAME: automated-interview-backend
  FRONTEND_SERVICE_NAME: automated-interview-frontend
  VERTEX_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  VERTEX_LOCATION: ${{ vars.GCP_REGION }}
  AI_DATA_RETENTION_ACKNOWLEDGED: true
  APP_QUESTION_BANK_SEED_ENABLED: false
  APP_ANSWER_EVALUATION_PROFILE: ai
  APP_QUESTION_ENRICHMENT_PROFILE: ai
  APP_EMBEDDING_PROFILE: ai
  APP_KAFKA_INDEXING_ENABLED: true
  APP_KAFKA_INDEXING_TOPIC: question-indexing.v1
  APP_KAFKA_INDEXING_DLT_TOPIC: question-indexing.v1.DLT
  APP_KAFKA_INDEXING_GROUP_ID: automated-interview-question-indexer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix frontend

      - name: Test contracts
        run: npm test --prefix contracts

      - name: Test frontend
        run: npm test --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Test backend
        run: mvn test -q -f backend/pom.xml

  deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Synchronize GitHub secrets to Secret Manager
        env:
          DATABASE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          DATABASE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          QUESTION_BANK_API_KEY: ${{ secrets.QUESTION_BANK_API_KEY }}
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.AIVEN_KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_USERNAME: ${{ secrets.AIVEN_KAFKA_USERNAME }}
          KAFKA_PASSWORD: ${{ secrets.AIVEN_KAFKA_PASSWORD }}
          KAFKA_CA_CERTIFICATE: ${{ secrets.AIVEN_KAFKA_CA_CERTIFICATE }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          test -n "$DATABASE_USERNAME"
          test -n "$DATABASE_PASSWORD"
          test -n "$QUESTION_BANK_API_KEY"
          test -n "$KAFKA_BOOTSTRAP_SERVERS"
          test -n "$KAFKA_USERNAME"
          test -n "$KAFKA_PASSWORD"
          test -n "$KAFKA_CA_CERTIFICATE"
          printf '%s' "$DATABASE_URL" | gcloud secrets versions add automated-interview-database-url --project "$GCP_PROJECT_ID" --data-file=-
          printf '%s' "$DATABASE_USERNAME" | gcloud secrets versions add automated-interview-database-username --project "$GCP_PROJECT_ID" --data-file=-
          printf '%s' "$DATABASE_PASSWORD" | gcloud secrets versions add automated-interview-database-password --project "$GCP_PROJECT_ID" --data-file=-
          printf '%s' "$QUESTION_BANK_API_KEY" | gcloud secrets versions add automated-interview-question-bank-api-key --project "$GCP_PROJECT_ID" --data-file=-
          printf '%s' "$KAFKA_BOOTSTRAP_SERVERS" | gcloud secrets versions add automated-interview-kafka-bootstrap-servers --project "$GCP_PROJECT_ID" --data-file=-
          printf '%s' "$KAFKA_USERNAME" | gcloud secrets versions add automated-interview-kafka-username --project "$GCP_PROJECT_ID" --data-file=-
          printf '%s' "$KAFKA_PASSWORD" | gcloud secrets versions add automated-interview-kafka-password --project "$GCP_PROJECT_ID" --data-file=-
          printf '%s' "$KAFKA_CA_CERTIFICATE" | gcloud secrets versions add automated-interview-kafka-ca-certificate --project "$GCP_PROJECT_ID" --data-file=-

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build backend image
        run: |
          docker build -t "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${BACKEND_SERVICE_NAME}:${GITHUB_SHA}" backend

      - name: Push backend image
        run: |
          docker push "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${BACKEND_SERVICE_NAME}:${GITHUB_SHA}"

      - name: Deploy backend
        id: backend
        run: |
          gcloud run deploy "${BACKEND_SERVICE_NAME}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --service-account "${GCP_SERVICE_ACCOUNT}" \
            --image "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${BACKEND_SERVICE_NAME}:${GITHUB_SHA}" \
            --platform managed \
            --allow-unauthenticated \
            --no-cpu-throttling \
            --min-instances 1 \
            --set-env-vars "VERTEX_PROJECT_ID=${VERTEX_PROJECT_ID},VERTEX_LOCATION=${VERTEX_LOCATION},AI_DATA_RETENTION_ACKNOWLEDGED=${AI_DATA_RETENTION_ACKNOWLEDGED},APP_QUESTION_BANK_SEED_ENABLED=${APP_QUESTION_BANK_SEED_ENABLED},APP_ANSWER_EVALUATION_PROFILE=${APP_ANSWER_EVALUATION_PROFILE},APP_QUESTION_ENRICHMENT_PROFILE=${APP_QUESTION_ENRICHMENT_PROFILE},APP_EMBEDDING_PROFILE=${APP_EMBEDDING_PROFILE},APP_KAFKA_INDEXING_ENABLED=${APP_KAFKA_INDEXING_ENABLED},APP_KAFKA_INDEXING_TOPIC=${APP_KAFKA_INDEXING_TOPIC},APP_KAFKA_INDEXING_DLT_TOPIC=${APP_KAFKA_INDEXING_DLT_TOPIC},APP_KAFKA_INDEXING_GROUP_ID=${APP_KAFKA_INDEXING_GROUP_ID}" \
            --set-secrets "SPRING_DATASOURCE_URL=automated-interview-database-url:latest,SPRING_DATASOURCE_USERNAME=automated-interview-database-username:latest,SPRING_DATASOURCE_PASSWORD=automated-interview-database-password:latest,QUESTION_BANK_API_KEY=automated-interview-question-bank-api-key:latest,SPRING_KAFKA_BOOTSTRAP_SERVERS=automated-interview-kafka-bootstrap-servers:latest,AIVEN_KAFKA_USERNAME=automated-interview-kafka-username:latest,AIVEN_KAFKA_PASSWORD=automated-interview-kafka-password:latest,AIVEN_KAFKA_CA_CERTIFICATE=automated-interview-kafka-ca-certificate:latest"

      - name: Read backend URL
        id: backend_url
        run: |
          echo "url=$(gcloud run services describe "${BACKEND_SERVICE_NAME}" --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Build frontend image
        run: |
          docker build \
            -t "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${FRONTEND_SERVICE_NAME}:${GITHUB_SHA}" \
            frontend

      - name: Push frontend image
        run: |
          docker push "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${FRONTEND_SERVICE_NAME}:${GITHUB_SHA}"

      - name: Deploy frontend
        run: |
          gcloud run deploy "${FRONTEND_SERVICE_NAME}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${FRONTEND_SERVICE_NAME}:${GITHUB_SHA}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "BACKEND_UPSTREAM_URL=${{ steps.backend_url.outputs.url }}"

      - name: Smoke test backend
        run: |
          curl -fsS "${{ steps.backend_url.outputs.url }}/api/health"
