server {
  listen 8080;
  server_name _;

  resolver 8.8.8.8 ipv6=off valid=30s;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    set $backend_upstream ${BACKEND_UPSTREAM_URL};
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    # Cloud Run can already provide a long forwarded-for chain. Do not append
    # that chain on every proxy hop or requests eventually exceed Nginx limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;
    proxy_busy_buffers_size 32k;
    proxy_connect_timeout 30s;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
